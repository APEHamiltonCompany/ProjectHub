business_days_per_week: 5
# Board buckets, in order. A stage set by hand on the project page always wins over emails.
buckets: [Pre-Kickoff, Pre-Fabrication, Fabrication, System Test, Closeout, Completion]
# Email subject keywords (case and spacing ignored) that move a project into a bucket.
# Override per user with email_rules in config.yaml (setup.cmd -> Email rules).
# When a subject matches several, the later bucket wins; ties go to the first listed.
# A project sits in the furthest bucket any of its emails reached.
triggers:
  - {id: assignment, label: Project assignment, stage: Pre-Kickoff, keywords: ['Project Assignment -'], no_reply: true}
  # id_keywords: whole word, and only when the subject also has an SO, QTE or 020 number ("SO-268679 - Pfizer KO Schedule").
  - {id: kickoff, label: Kickoff, stage: Pre-Fabrication, keywords: [kickoff, kick off, kick-off], id_keywords: [KO]}
  - {id: internal_design_review, label: Internal design review, stage: Pre-Fabrication, keywords: [internal design review, internal review, DR internal, internal DR]}
  - {id: design_review, label: Design review, stage: Pre-Fabrication, keywords: [design review]}
  - {id: work_order_firm, label: Work order firm, stage: Fabrication, keywords: [WO firm, work order firm]}
  - {id: at_notification, label: A&T notification, stage: System Test, keywords: [A&T Notification]}
  - {id: closeout, label: Closeout, stage: Closeout, keywords: [closeout, close out]}
# Checklist headings on the project page and in the note (no Fabrication: nothing to do while a project waits there).
stages:
  - Pre-Kickoff
  - Pre-Fabrication
  - System Test
  - Closeout
  - Completion
# PM schedule rows read from the project's timeline tables. Only these become deadlines.
# Each milestone takes its dates from the newest PM table that lists it (kickoff, A&T notification, or a PM reply in the thread).
# match: regexes tried against the row name with the customer/SO prefix removed. A milestone is due on the row's finish date.
# optional: only added when the chart has the row, or (no chart yet) the project level is in levels.
milestones:
  - {id: ms_prefab, stage: Pre-Fabrication, title: "PreFabApps", match: ['^PreFab\s*Apps']}
  - {id: ms_test_plan, stage: Pre-Fabrication, title: "Send Test Plan for Review & List of Parts for Testing", match: ['^Send Test Plan']}
  - {id: ms_testing, stage: System Test, title: "Testing", match: ['^Testing$']}
  - {id: ms_pre_fat, stage: System Test, title: "Pre-FAT", match: ['^Pre-?i?FAT\b'], optional: true, levels: [L3, L4]}
  - {id: ms_ifat, stage: System Test, title: "Field Apps & iFAT", match: ['^Field Apps', '^iFAT\b'], optional: true, levels: [L3, L4]}
  - {id: ms_fat, stage: System Test, title: "FAT", match: ['^FAT$'], optional: true, levels: [L3, L4]}
  - {id: ms_pack_up, stage: System Test, title: "AE Pack Up", match: ['^AE Pack\s*Up', '^Pack\s*Up$', '^AE Disassembly']}
  - {id: ms_closeout, stage: Closeout, title: "AutoE Close Out", match: ['^AutoE Close\s*Out']}
# Checklist steps. milestone: the PM row the step sits under (due on that row's finish date).
# trigger + offset: an email that dates the step (business days after it), used only while its milestone has no date.
# levels: project levels that get the step (all when omitted). repeat: false hides it on repeat projects (L1R, L2R...).
# mandatory: true = always on for every project (levels/repeat ignored). Every other step and milestone is optional:
# each user ticks the ones they want in Settings > Project checklist, and only the generated items count toward status.
workflow:
  - {id: review_cpr_so, stage: Pre-Kickoff, title: "Review CPR/SO in D365", trigger: assignment, offset: 2, launch: 'tool:wire_diagram_builder'}
  - {id: ace_questions, stage: Pre-Kickoff, title: "Kickoff pre-work questions to ACE", trigger: assignment, offset: 2}
  - {id: time_estimate, stage: Pre-Fabrication, title: "Time Estimate (in Project Page)", trigger: assignment, offset: 2, launch: 'file:time_estimate', mandatory: true}
  - {id: adp_start, stage: Pre-Fabrication, milestone: ms_prefab, title: "Start ADP/APC draft (post to SharePoint)", launch: 'file:project_document'}
  - {id: kickoff_meeting, stage: Pre-Fabrication, milestone: ms_prefab, title: "Kickoff: review CPR, time estimates and demo agreement; update Apps Plan", trigger: kickoff, offset: 0, launch: 'file:project_document'}
  - {id: wiring_diagram, stage: Pre-Fabrication, milestone: ms_prefab, title: "Wiring Diagram (in Design Review)", trigger: internal_design_review, offset: 1, launch: 'tool:wire_diagram_builder', levels: [L2, L3, L4], repeat: false, mandatory: true}
  - {id: test_matrix, stage: Pre-Fabrication, milestone: ms_prefab, title: "Test Matrix (in Design Review)", trigger: internal_design_review, offset: 1, launch: 'file:test_matrix', repeat: false, mandatory: true}
  - {id: design_review, stage: Pre-Fabrication, milestone: ms_prefab, title: "Design review: present wiring diagram + test matrix; update RMT", trigger: design_review, offset: 0, launch: 'file:test_matrix', repeat: false}
  - {id: apps_plan, stage: Pre-Fabrication, milestone: ms_test_plan, title: "Applications Test Plan/APE Part Compliance (in Project Page)", trigger: design_review, offset: 5, launch: 'file:project_document', repeat: false, mandatory: true}
  - {id: parts_for_testing, stage: Pre-Fabrication, milestone: ms_test_plan, title: "Part Requirements for Testing (in Project Page)", trigger: work_order_firm, offset: 5, launch: 'file:parts_request', mandatory: true}
  - {id: app_dev, stage: System Test, milestone: ms_testing, title: "Preliminary applications development (controllers, simulated apps)", levels: [L2, L3, L4]}
  - {id: system_setup, stage: System Test, milestone: ms_testing, title: "System Set up (Lab)", trigger: at_notification, offset: 2, levels: [L2, L3, L4], mandatory: true}
  - {id: device_cables, stage: System Test, milestone: ms_testing, title: "Update Device Cables (Cable Document)", trigger: at_notification, offset: 5, mandatory: true}
  - {id: device_testing, stage: System Test, milestone: ms_testing, title: "Device handoff and functionality testing", levels: [L2, L3, L4]}
  - {id: app_troubleshooting, stage: System Test, milestone: ms_testing, title: "Applications and system troubleshooting (per FAT document)", levels: [L2, L3, L4]}
  - {id: testing_demo, stage: System Test, milestone: ms_testing, title: "Complete Testing and Demonstration (Lab)", trigger: at_notification, offset: 10, mandatory: true}
  - {id: ifat, stage: System Test, milestone: ms_ifat, title: "Internal FAT (iFAT)", levels: [L3, L4]}
  - {id: fat, stage: System Test, milestone: ms_fat, title: "FAT / test demonstration (distribute video)", levels: [L3, L4]}
  - {id: post_fat, stage: System Test, milestone: ms_fat, title: "Post-FAT action items; demo for shipment approval", levels: [L3, L4]}
  - {id: pack_up, stage: System Test, milestone: ms_pack_up, title: "Pack up: wire routing docs, closeout photos"}
  - {id: co_package_files, stage: Closeout, milestone: ms_closeout, title: "Package Files (in Project Page)", trigger: closeout, offset: 5, mandatory: true}
  - {id: co_methods, stage: Closeout, milestone: ms_closeout, title: "Methods posted to project page", levels: [L2, L3, L4]}
  - {id: co_labware, stage: Closeout, milestone: ms_closeout, title: "Labware (in Project Page)", trigger: closeout, offset: 5, mandatory: true}
  - {id: co_support_docs, stage: Closeout, milestone: ms_closeout, title: "Integration support documents posted", levels: [L2, L3, L4]}
  - {id: co_parts_list, stage: Closeout, milestone: ms_closeout, title: "Parts List Entry (in Parts list)", trigger: closeout, offset: 5, mandatory: true}
  - {id: co_software, stage: Closeout, milestone: ms_closeout, title: "Device controller / installers published (when applicable)", levels: [L2, L3, L4]}
  - {id: co_adp_results, stage: Closeout, milestone: ms_closeout, title: "Complete Applications Test Plan (in Project Page)", trigger: closeout, offset: 5, launch: 'file:project_document', mandatory: true}
  - {id: co_device_controller, stage: Closeout, milestone: ms_closeout, title: "Device Controller (Shared One Drive folder) (When Applicable)", trigger: closeout, offset: 5, mandatory: true}
  - {id: co_installers, stage: Closeout, milestone: ms_closeout, title: "Controller Installers (Shared One Drive folder, SharePoint page) (When Applicable)", trigger: closeout, offset: 5, mandatory: true}
  - {id: co_uv, stage: Closeout, milestone: ms_closeout, title: "UV reports posted (when applicable)", levels: [L2, L3, L4]}
  - {id: co_wiki, stage: Closeout, milestone: ms_closeout, title: "Update Device Wikis (SharePoint pages) (When Applicable)", trigger: closeout, offset: 5, levels: [L2, L3, L4], mandatory: true}
  - {id: co_fat_templates, stage: Closeout, milestone: ms_closeout, title: "Update Device FAT Test Template (SharePoint pages) (When Applicable)", trigger: closeout, offset: 5, levels: [L2, L3, L4], mandatory: true}
  - {id: closeout_reply, stage: Closeout, milestone: ms_closeout, title: "Reply to PM closeout email (docs posted)", trigger: closeout, offset: 5}
  - {id: retrospective, stage: Completion, title: "Retrospective with PM/engineer", levels: [L3, L4]}
  - {id: post_support, stage: Completion, title: "Installation / SAT support", levels: [L3, L4]}
