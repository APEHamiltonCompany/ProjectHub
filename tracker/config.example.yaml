# ProjectHub configuration template.
# Run setup.cmd to create your own tracker/config.yaml from this file.
# tracker/config.yaml is per-user and gitignored; edit this template only to change the defaults for everyone.

# --- Inputs you provide -------------------------------------------------------

# Folder that holds your projects (see project_folder_layout).
vault: ""
# How new project folders are named inside the vault:
#   customer/so  ->  <vault>/<Customer>/SO-######   (QTE-###### or the project number if there is no SO)
#   flat         ->  <vault>/<Customer> SO-###### <project number>
# Both layouts are recognised when reading the vault, so existing folders keep working.
project_folder_layout: customer/so
# Markdown file for non-project tasks. Created automatically. Default: <vault>/My Tasks.md
personal_tasks_path: ""
# Vault subfolders that are not projects.
exclude_folders:
  - General
# Folders searched (recursively) for saved .eml/.msg emails. Relative paths are inside the repo.
# Missing folders are skipped.
eml_folders:
  - email_drop
# Also search the vault project folders for saved emails.
scan_project_folders: true
# Classic Outlook (not "New Outlook") access, read-only.
outlook_com:
  enabled: true
  # mailbox = every mail folder incl. Sent Items (Junk, Deleted Items, Drafts, Outbox always skipped);
  # folders = only the folders listed under folders.
  scope: mailbox
  # mailbox scope: folder names or paths to skip (and their subfolders), e.g. [Graymail, Inbox/IT Announcements].
  skip_folders: []
  folders:
    - Inbox
  calendar: true
  # How many days of email/calendar history to read (--since N on the command line overrides it).
  days_back: 60
  # Refreshes read only mail received since the last refresh (minus a day of overlap); earlier mail comes from
  # output/outlook_cache.json. A full read happens when the last one is older than full_read_hours.
  incremental: true
  full_read_hours: 24
me:
  # Your name exactly as it appears in PM kickoff schedules.
  name: ""
  # Not currently used by the code.
  email: ""
# Company holidays; skipped when counting business-day deadlines.
holidays:
  - 2026-11-26
  - 2026-11-27
  - 2026-12-24
  - 2026-12-25
  - 2026-12-31
  - 2027-01-01
  - 2027-05-31
  - 2027-07-05
  - 2027-09-06
# true: new assignment emails create project folders automatically. false: they wait in the hub for "Create project".
# Either way, an assignment email only counts as yours when me.name or me.email is on its To: line (CC doesn't count).
auto_create_projects: false
# Optional: your own email rules (setup.cmd -> Email rules). Without this, the triggers in rules.yaml apply.
# email_rules:
#   - {id: at_notification, label: A&T notification, stage: System Test, keywords: [A&T Notification]}
# Days ahead that count as "due soon" in the tracker summary.
due_soon_days: 3
# Legacy: used only when project_files (below) is not set. Copied as "TimeEstimates <SO>.xlsx".
time_estimate_template: ""

# --- Template files copied into new project folders -------------------------------
# Folder the project_files sources are relative to.
templates_root: 'R:/APE_AE/TEMPLATES'
# Files without a group are copied into every new project. For each group you pick one file
# (or None if none_allowed) when creating the project in the hub; automatic creation adds a
# task to pick it on the project page. The newest version of a source is used (lock files and
# "(1)" copies are ignored); existing copies are never overwritten.
# Name tokens: {ident} = SO, else QTE, else project #; {so}; {qte}; {project_no}; {customer}.
project_files:
  files:
    - {id: time_estimate, label: TimeEstimates, source: 'Time Estimate/TimeEstimates*.xlsx', name: 'TimeEstimates {ident}'}
    - {id: parts_request, label: Parts request, source: 'Parts Request/PartsRequestSO-*.xlsx', name: 'PartsRequest{ident}'}
    - {id: test_matrix_l1, group: test_matrix, label: L1Carrier, source: 'Design Review Test Matrix/DesignReview_TestMatrix_L1Carrier*.pptx', name: 'DesignReview_TestMatrix_L1Carrier {ident}'}
    - {id: test_matrix_l2l3, group: test_matrix, label: L2L3, source: 'Design Review Test Matrix/DesignReview_TestMatrix_L2L3*.pptx', name: 'DesignReview_TestMatrix_L2L3 {ident}'}
    - {id: compliance, group: project_document, label: Compliance, source: 'Generic Test Checklists/APE Custom 020XXXX Compliance_V*.docx', name: 'APE Custom {project_no} Compliance_V1.0.0'}
    - {id: apps_plan, group: project_document, label: Applications plan, source: 'Apps Plan/Applications Development Plan Template v*.docx', name: 'Applications Development Plan {ident}'}
  groups:
    test_matrix: {label: Test matrix, none_allowed: true}
    project_document: {label: Project document, none_allowed: false}

# --- Program output (created automatically; defaults are inside this repo) -----
# snapshot_path: output/snapshot.json
# dashboard.output: output/dashboard.html
# state_path: tracker/state.json
# log_path: output/last_run.log
# backup_root: backups
# templates_dir: templates
dashboard:
  plotly_js: cdn
# Not currently used by the code.
timezone: local
hub:
  port: 8765
  refresh_minutes: 15
  # Windows notification for new assignments.
  toast: true
# Not currently used by the code.
ai:
  enabled: false
# Copy templates/Dashboard.md into the vault root (for Obsidian users).
install_dashboard_note: false

# --- APE Project Tracking workbook (read-only) ---------------------------------
ape_sheet:
  enabled: true
  # SharePoint shortcut (.url file, or a folder holding "APE Project Tracking*.url"). When found, the sheet is
  # opened read-only in a hidden Excel (your Office sign-in) and a copy saved in data/ape_tracker, at most every
  # download_hours; "Sync to Project Tracker" on the Projects page always gets a fresh copy.
  shortcut: "R:/APE_AE"
  download_hours: 12
  # Fallback folder searched for the workbook (e.g. where you download it).
  path: ""
  pattern: "APE Project Tracking*.xlsx"
  # Look for a OneDrive-synced copy named sync_filename first.
  auto_find: true
  sync_filename: "APE Project Tracking.xlsx"
  # Your initials as used in the sheet's assignment columns.
  my_initials: ""
  # Hours after which a downloaded copy is flagged as stale.
  stale_hours: 48
  url: "https://hamiltonmarketing.sharepoint.com/:x:/s/RNOAPE/IQDm4sasM7CTR6tIlW4RZwudAQ5vAffff0kaw_GEz2RITfA?e=Jraqhi"

# --- Backup vault (offline copy of the project folder) ----------------------------
# The hub copies the vault (and any extra folders) here every day at daily_time; a backup missed while the PC
# was off runs at the next start. All files are copied. Files deleted on R: are moved to
# <backup>/.projecthub_deleted/<date>/. When R: is unreachable (offline_fallback) or "Work offline" is switched
# on in Settings, the hub works from these copies; changes made offline are brought back with
# Settings > Backup vault > "Import offline changes" (preview first, nothing is merged automatically).
backup_vault:
  # e.g. "E:/My Projects" (external drive) or "C:/ProjectHub Backup/My Projects". Blank = no backup.
  path: ""
  # HH:MM, blank = only when "Back up now" is clicked.
  daily_time: "14:00"
  # Switch to the backup automatically when the vault cannot be reached.
  offline_fallback: true
  # Extra folders to keep a copy of, e.g. the project templates.
  folders: []
  #  - source: "R:/APE_AE/TEMPLATES"
  #    backup: "E:/APE_AE_RDrive/TEMPLATES"

# --- Optional tools and file templates -------------------------------------------
tools:
  # WireDiagramBuilder.exe, launched from wiring-diagram tasks.
  wire_diagram_builder: ""
# Files copied from a task button ('template:<name>' launches; 'file:<id>' uses project_files above). {ident} = SO/QTE, {project_folder} = the project folder.
file_templates:
  parts_request:
    source: 'R:\APE_AE\TEMPLATES\Parts Request\PartsRequestSO-XXXXXXX.xlsx'
    name: 'PartsRequest {ident}.xlsx'
    folders: ['{project_folder}']
    fill: {}
